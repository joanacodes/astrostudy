# Kind words. Quoted as written; cuts are marked with an ellipsis.
#
# featured: a message a client sent on Instagram after a birth chart reading,
# shortened and anonymised — the most personal passages are left out on purpose.
# Ask the client before publishing if you haven't already.
featured:
  pull: "I really feel ease after your reading."
  quote:
    - "I don't know where you live or who you are or what's your actual name… but I really want to meet you one day and want to thank you."
    - "I always wonder why I always feel like delaying… why this situation feels so heavy… And you just find me the answers like I am an open book to you."
    - "You wrote about my insecurities, about my internal collision, about my working style, about my strength, about my creativeness, about my communication skills, all of these with a really soft language."
    - "I don't know about the degrees or how the planets work, but now I can understand… It feels like all my planets like to work inward first. I don't know whether to feel happy or sad… but I really feel ease after your reading."
  name: "A client"
  context: "after a birth chart reading · a message on Instagram, shortened"

