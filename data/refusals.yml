# What I won't read — the same list as Maison Tarot. Not prudishness: these are the subjects
# where a chart, even well read, can do harm.
- "Health diagnoses and medical questions."
- "Death — yours or a loved one’s."
- "Pregnancy."
- "Ongoing legal proceedings."
- "Investments and financial decisions."
- "“Curses to lift”, and any paid “work” to free you from one. That is the very definition of a scam."
- "Minors — no readings for them, and none about them."
