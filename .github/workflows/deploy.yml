# Deploys The Astro Study to Cloudflare Workers, as AGS is deployed: the Hugo site as static files,
# plus worker/index.js for /api/sky — the sky of the day, read from FreeAstroAPI with the key kept
# on the Worker, never in a page. Runs on every push to main, or by hand (Actions → "Deploy to
# Cloudflare" → Run workflow). Pushes to other branches build the site and check the Worker,
# without deploying anything.
#
# Repository secrets (Settings → Secrets and variables → Actions), see README → "Hosting":
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — the same values as AGS
#   FREE_ASTRO_API — the FreeAstroAPI key, handed to the Worker as FREE_ASTRO_API_KEY
name: Deploy to Cloudflare
on:
  push:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      WRANGLER_VERSION: 4.151.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hugo (extended)
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Build the site
        run: hugo --gc --minify

      - name: Check the Worker (not deployed from this branch)
        if: github.ref != 'refs/heads/main'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      - name: Check required secrets
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret $name (see README → Hosting)"; missing=1; fi
          done
          exit $missing

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The key goes to the Worker as an encrypted secret: never in git, never in a page.
      - name: Hand the FreeAstroAPI key to the Worker
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FREE_ASTRO_API: ${{ secrets.FREE_ASTRO_API }}
        run: |
          if [ -z "$FREE_ASTRO_API" ]; then
            echo "::warning::No FREE_ASTRO_API secret: the home page goes without the sky of the day."
            exit 0
          fi
          printf '%s' "$FREE_ASTRO_API" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put FREE_ASTRO_API_KEY
