# Builds and publishes The Astro Study. On main it goes to one of two places:
#   - Cloudflare Workers, as AGS is deployed, once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#     secrets exist: the Hugo site as static files, plus worker/index.js for /api/sky (the sky of the
#     day, read from FreeAstroAPI with the key kept on the Worker, never in a page);
#   - until then, GitHub Pages, as a preview: the whole site, with the sky captured at build time
#     (Pages has no server to keep the key; a daily run keeps it fresh). One-time setting:
#     Settings → Pages → Source: "GitHub Actions".
# Pushes to other branches build the site and check the Worker, without publishing anything.
#
# Repository secrets (Settings → Secrets and variables → Actions), see README → "Hosting":
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — the same values as AGS
#   FREE_ASTRO_API — the FreeAstroAPI key, handed to the Worker as FREE_ASTRO_API_KEY
name: Deploy
on:
  push:
  # the moment the repository is made public, the preview publishes itself (see the wait below)
  public:
  # once a day, so the sky carried in the pages stays fresh where no Worker serves it (the preview);
  # each browser moves it on to the minute, which holds for about three days
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    env:
      HUGO_VERSION: 0.165.0
      WRANGLER_VERSION: 4.151.0
    steps:
      - uses: actions/checkout@v4

      - name: Choose where this build goes
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            target=check
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            target=cloudflare
          else
            target=pages
            echo "::notice::No Cloudflare secrets yet: publishing a preview on GitHub Pages, with the sky captured at build time."
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "This build goes to: $target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hugo (extended)
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      # Pages has to be switched on once by hand (Settings → Pages → Source: GitHub Actions), often
      # just after making the repository public: wait up to ten minutes for it rather than fail.
      - name: Wait for GitHub Pages to be switched on
        if: steps.target.outputs.target == 'pages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)"
            if [ "$build_type" = "workflow" ]; then echo "GitHub Pages is on."; exit 0; fi
            if [ "$i" = 1 ]; then
              echo "::notice::Waiting for GitHub Pages: Settings → Pages → Build and deployment → Source: GitHub Actions."
            fi
            sleep 10
          done
          echo "::error::GitHub Pages is still off. Settings → Pages → Source: GitHub Actions, then run this workflow again (Actions → Deploy → Run workflow)."
          exit 1

      - uses: actions/configure-pages@v5
        id: pages
        if: steps.target.outputs.target == 'pages'

      # The sky of the day, written into data/sky.json and carried inline by every page (first paint,
      # the preloader, the preview). Only positions and speeds: the key stays in this step.
      - name: Capture the sky of the day
        env:
          FREE_ASTRO_API: ${{ secrets.FREE_ASTRO_API }}
        run: node tools/sky-snapshot.mjs

      # Share pictures (Open Graph images and Pinterest pins) for every article, drawn from the brand
      # templates in tools/brand-images. The cache brings back the last run's pictures, so only pages
      # whose words changed are drawn again. A failure here never blocks a deploy: a page without its
      # own picture uses the site's.
      - name: Restore the share pictures
        uses: actions/cache@v4
        with:
          path: |
            static/og
            static/pin
            tools/brand-images/.cache
          key: share-pictures-${{ hashFiles('content/**/*.md', 'tools/brand-images/render.mjs') }}
          restore-keys: share-pictures-

      - name: Draw the share pictures
        continue-on-error: true
        run: |
          npm --prefix tools/brand-images install --no-audit --no-fund
          npx --prefix tools/brand-images playwright install --with-deps chromium
          node tools/brand-images/render.mjs --site

      - name: Build the site
        env:
          # the legal and privacy notices name whoever actually serves the site
          HUGO_PARAMS_LEGAL_HOST: ${{ steps.target.outputs.target == 'pages' && 'github' || 'cloudflare' }}
          # the GitHub Pages preview stays out of search engines (the real site is astrostudy.co.uk)
          HUGO_PARAMS_PREVIEW: ${{ steps.target.outputs.target == 'pages' && 'true' || '' }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify ${BASE_URL:+--baseURL "$BASE_URL/"}

      - name: Check the Worker (not deployed from this branch)
        if: steps.target.outputs.target == 'check'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      - name: Deploy to Cloudflare
        if: steps.target.outputs.target == 'cloudflare'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The key goes to the Worker as an encrypted secret: never in git, never in a page.
      - name: Hand the FreeAstroAPI key to the Worker
        if: steps.target.outputs.target == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FREE_ASTRO_API: ${{ secrets.FREE_ASTRO_API }}
        run: |
          if [ -z "$FREE_ASTRO_API" ]; then
            echo "::warning::No FREE_ASTRO_API secret: the home page goes without the sky of the day."
            exit 0
          fi
          printf '%s' "$FREE_ASTRO_API" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put FREE_ASTRO_API_KEY

      - uses: actions/upload-pages-artifact@v3
        if: steps.target.outputs.target == 'pages'
        with:
          path: ./public

  pages:
    needs: build
    if: needs.build.outputs.target == 'pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
