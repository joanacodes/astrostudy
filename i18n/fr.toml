# llms.txt (une carte du site en texte simple, pour les assistants IA)
llmsAbout = """The Astro Study propose des lectures d'astrologie écrites, en français et en anglais : des lectures de thème natal pour les adultes (18 ans et plus) et des synastries pour les couples, les amis, les collègues et la famille. Chaque lecture est préparée avec le système maison, puis relue en entier avant l'envoi ; elle arrive sous une semaine dans un espace privé en ligne. Les lectures et les articles sont signés Joana, qui tient The Astro Study.

La méthode vient de tests de l'astrologie, placement par placement. Dans les carnets de test de The Astro Study, environ 30 à 40 % des placements ont tenu dans l'ensemble, tandis que Saturne, Lilith et Chiron ont tenu 75 à 90 % du temps : les lectures passent donc le plus de temps là, et disent quelles parties reposent sur moins. Les lectures sont proposées à titre de réflexion et de divertissement.

The Astro Study ne lit ni la santé, ni la mort, ni la grossesse, ni les procédures juridiques, ni les placements, et ne lit ni pour ni sur une personne de moins de 18 ans. Une synastrie suppose que l'autre personne soit au courant (pour des collègues, qu'elle soit d'accord)."""
