# The Astro Study — Hugo configuration.
# One canonical domain. The site is served by Cloudflare (wrangler.jsonc); the sky of the day comes from
# worker/index.js at /api/sky, not from the build.
baseURL = "https://astrostudy.co.uk/"
title = "The Astro Study"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Europe/London"
disableKinds = ["taxonomy", "term", "rss"]

# English is the main site, at the root. French lives under /fr/: the same pages, French addresses
# (/fr/theme-natal/, /fr/synastrie/collegues/…). A page and its translation share a file name.
[languages]
  [languages.en]
    label = "English"
    locale = "en-GB"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      description = "Birth chart readings for adults and synastry readings for couples, friends, co-workers and family. Written in plain language, by someone who tested astrology before trusting it."
      ogImage = "media/og.jpg"
      replyTime = ""      # e.g. "within three working days" — empty = no promise is shown
      format = ""         # e.g. "A private online reading, within 10 days" — empty = the line written in each page
      nextSlot = ""       # e.g. "this week", "from 3 November" — shown under the form's reading menu; empty = hidden
    [[languages.en.menus.main]]
      name = "Birth chart"
      pageRef = "/birth-chart"
      weight = 10
      [languages.en.menus.main.params]
        glyph = "☉"
        blurb = "Your chart, placement by placement, in plain words."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/birth-chart.jpg" (about 4:3)
    [[languages.en.menus.main]]
      name = "Synastry"
      pageRef = "/synastry"
      weight = 20
      [languages.en.menus.main.params]
        glyph = "☌/☍"
        blurb = "Two charts side by side, for each kind of bond."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/synastry.jpg" (about 4:3)
    [[languages.en.menus.main]]
      name = "How I read"
      pageRef = "/how-i-read"
      weight = 30
      [languages.en.menus.main.params]
        glyph = "♄"
        blurb = "How I tested astrology before trusting it."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/how-i-read.jpg" (about 4:3)
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 35
      [languages.en.menus.main.params]
        glyph = "✦"
        blurb = "Notes from the reading desk."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/blog.jpg" (about 4:3)
    [[languages.en.menus.main]]
      name = "Kind words"
      pageRef = "/"
      weight = 40
      [languages.en.menus.main.params]
        fragment = "kind-words"
        glyph = "★"
        blurb = "What people said after their readings."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/kind-words.jpg" (about 4:3)
    [[languages.en.menus.footer]]
      name = "Disclaimers"
      pageRef = "/disclaimers"
      weight = 20
    [[languages.en.menus.footer]]
      name = "Privacy"
      pageRef = "/privacy"
      weight = 30
    [[languages.en.menus.footer]]
      name = "Legal notice"
      pageRef = "/legal-notice"
      weight = 40

  [languages.fr]
    label = "Français"
    locale = "fr-FR"
    contentDir = "content/fr"
    weight = 2
    [languages.fr.params]
      description = "Lectures de thème natal pour adultes, et synastries pour les couples, les amis, les collègues et la famille. Écrites avec des mots simples, par quelqu’un qui a testé l’astrologie avant d’y croire."
      ogImage = "media/og-fr.jpg"
      maisonTarot = ""    # the French pages of Maison Tarot, once it has its final address
      replyTime = ""      # ex. « sous trois jours ouvrés » — vide = aucune promesse affichée
      format = ""         # ex. « Une lecture privée, en ligne, sous 10 jours »
      nextSlot = ""       # ex. « cette semaine », « à partir du 3 novembre » — vide = rien d’affiché
    [languages.fr.permalinks.page]
      synastry = "/synastrie/:slug/"
    [languages.fr.permalinks.section]
      synastry = "/synastrie/"
    [[languages.fr.menus.main]]
      name = "Thème natal"
      pageRef = "/birth-chart"
      weight = 10
      [languages.fr.menus.main.params]
        glyph = "☉"
        blurb = "Votre thème, placement par placement, avec des mots simples."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/birth-chart.jpg" (about 4:3)
    [[languages.fr.menus.main]]
      name = "Synastrie"
      pageRef = "/synastry"
      weight = 20
      [languages.fr.menus.main.params]
        glyph = "☌/☍"
        blurb = "Deux thèmes côte à côte, pour chaque sorte de lien."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/synastry.jpg" (about 4:3)
    [[languages.fr.menus.main]]
      name = "Ma méthode"
      pageRef = "/how-i-read"
      weight = 30
      [languages.fr.menus.main.params]
        glyph = "♄"
        blurb = "Comment j’ai testé l’astrologie avant d’y croire."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/how-i-read.jpg" (about 4:3)
    [[languages.fr.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 35
      [languages.fr.menus.main.params]
        glyph = "✦"
        blurb = "Notes depuis ma table de lecture."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/blog.jpg" (about 4:3)
    [[languages.fr.menus.main]]
      name = "Témoignages"
      pageRef = "/"
      weight = 40
      [languages.fr.menus.main.params]
        fragment = "kind-words"
        glyph = "★"
        blurb = "Ce qu’en disent les personnes que j’ai lues."
        image = ""   # the card's picture in the computer menu, e.g. "media/menu/kind-words.jpg" (about 4:3)
    [[languages.fr.menus.footer]]
      name = "Avertissements"
      pageRef = "/disclaimers"
      weight = 20
    [[languages.fr.menus.footer]]
      name = "Confidentialité"
      pageRef = "/privacy"
      weight = 30
    [[languages.fr.menus.footer]]
      name = "Mentions légales"
      pageRef = "/legal-notice"
      weight = 40

[params]
  brand = "The Astro Study"
  email = "hello@astrostudy.co.uk"
  # FormSubmit: the first message sent triggers an activation email to this address. Click "Activate" once.
  # After activation FormSubmit offers a random alias (formsubmit.co/el/xxxx): paste it into both lines below so the
  # address isn't in the form's code. It still appears where the site shows it on purpose (footer, contact page).
  formEndpoint = "https://formsubmit.co/hello@astrostudy.co.uk"
  formAjaxEndpoint = "https://formsubmit.co/ajax/hello@astrostudy.co.uk"
  # Empty = hidden. Fill when ready. Any of these can also be set per language, under [languages.xx.params].
  instagram = ""          # e.g. "https://www.instagram.com/astrostudy"
  maisonTarot = ""        # the Maison Tarot site, once it has its final address
  priceBirthChart = ""    # e.g. "£65" — empty = "on request"; the full reading
  priceSynastry = ""      # e.g. "£95"
  priceBirthChartConsulting = ""   # the full reading + consulting, e.g. "£110" — shown in the order panel
  priceSynastryConsulting = ""     # e.g. "£150"
  # Payment: one Stripe Payment Link per reading and option (Stripe → Payment links → + New), pasted
  # below. In each link: After payment → "Don't show confirmation page" → redirect customers to
  #   https://astrostudy.co.uk/order-received/?session_id={CHECKOUT_SESSION_ID}
  # (one address for both languages: a French order moves on to the French page by itself).
  # Empty = that one isn't open for payment yet: the form says so and sends nothing.
  # README → "Payments" has the whole path, from the form to the reading.
  [params.stripe]
    birthChart = ""            # e.g. "https://buy.stripe.com/…" — the birth chart reading
    birthChartConsulting = ""  # the birth chart reading + consulting
    synastry = ""              # a synastry reading (all four kinds)
    synastryConsulting = ""    # a synastry reading + consulting
  [params.legal]
    # The legal notice (mentions légales, required by French law for a site published from France) and the
    # privacy notice read these. Anything left empty shows on those pages as a highlighted [to fill in] marker,
    # and the build log lists it, so nothing is missing without anyone noticing.
    publisherName = ""      # first name and surname, e.g. "Prénom Nom"
    status = ""             # e.g. "Entrepreneur individuel (EI) — micro-entreprise"
    address = ""            # postal address (a domiciliation address is fine)
    phone = ""              # French law asks for a phone number on the legal notice
    siren = ""              # SIREN (or SIRET) from the Registre national des entreprises
    vat = ""                # optional, e.g. "TVA non applicable, art. 293 B du CGI"
    mediatorName = ""       # the consumer mediator you've joined (required to sell to consumers in France)
    mediatorUrl = ""        # its website
    # Who serves the site: "cloudflare" or "github" (the preview on GitHub Pages). The deploy workflow sets it.
    host = "cloudflare"

[markup]
  # the anchor menu of a blog article lists its sections (## headings)
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = true

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[minify]
  minifyOutput = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5
