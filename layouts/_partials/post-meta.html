{{- /* Date · reading time · category, in the page's language. */ -}}
<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time> · {{ i18n "blogMinutes" (dict "n" .ReadingTime) }}{{ with .Params.categories }} · {{ delimit . ", " }}{{ end }}
